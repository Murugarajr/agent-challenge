services:
  # ── Python AST Analysis Service ──────────────────────────────────
  analysis-service:
    build:
      context: ./analysis-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MISOKI_GITHUB_API_BASE=https://api.github.com
      - MISOKI_MAX_REPO_FILES=40
      - MISOKI_REQUEST_TIMEOUT_SECONDS=30
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── ElizaOS Agent (TypeScript) ────────────────────────────────────
  agent:
    build:
      context: ..
      dockerfile: Dockerfile.local
    ports:
      - "3000:3000"
    environment:
      - OPENAI_BASE_URL=${NOSANA_MODEL_ENDPOINT}
      - OPENAI_API_KEY=${NOSANA_API_KEY}
      - OPENAI_SMALL_MODEL=Qwen/Qwen3.5-4B
      - OPENAI_LARGE_MODEL=Qwen/Qwen3.5-4B
      - MISOKI_ANALYSIS_SERVICE_URL=http://analysis-service:8000
      - MISOKI_ANALYSIS_MAX_FILES=10
      - MISOKI_ANALYSIS_TIMEOUT_MS=120000
    depends_on:
      analysis-service:
        condition: service_healthy

  # ── React / Next.js Web Frontend ─────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    environment:
      # Runtime vars for Next.js API routes (app/api/analysis, app/api/agent).
      # Browser calls same-origin /api/analysis/* and /api/agent/* only.
      - ANALYSIS_SERVICE_URL=http://analysis-service:8000
      - AGENT_URL=http://agent:3000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      - analysis-service
      - agent
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5